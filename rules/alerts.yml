groups:
  - name: event-system-alerts
    rules:
      - alert: EventAppDown
        expr: up{job="event-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Event App is down
          description: Event App target is not reachable.
      - alert: HostHighCpu
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Host CPU is above 80 percent
          description: Host CPU usage has exceeded 80 percent for 2 minutes.
